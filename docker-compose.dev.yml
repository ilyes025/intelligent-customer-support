version: "3.8"

services:
  web:
    build: .
    command: ./start-dev.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - EXTERNAL_API_BASE_URL=${EXTERNAL_API_BASE_URL:-https://jsonplaceholder.typicode.com}
      - HF_API_TOKEN=${HF_API_TOKEN:-}
